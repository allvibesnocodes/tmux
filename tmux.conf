# quality of life
# vi-style keys
set-window-option -g mode-keys vi
# vim 'v' to start selection
bind-key -T copy-mode-vi v send -X begin-selection
# vim 'y' to copy to clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
# vim style page navigation
bind-key 'h' select-pane -L
bind-key 'j' select-pane -D
bind-key 'k' select-pane -U
bind-key 'l' select-pane -R
# no confirm on close
bind-key & kill-window
bind-key x kill-pane

# nvim
# set escape time for tmux
set-option -sg escape-time 10
# set focus-events
set-option -g focus-events on
# tmux color support
set-option -a terminal-features 'tmux-256color:RGB'
set -g default-terminal "tmux-256color"

# tpm
# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'janoamaral/tokyo-night-tmux'
# auto-install tpm + plugins on first launch (self-contained, no external installer)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
# initialize tpm
run '~/.config/tmux/plugins/tpm/tpm'
